<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1f2e"/>
      <stop offset="100%" stop-color="#0b0d14"/>
    </linearGradient>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4ff38"/>
      <stop offset="100%" stop-color="#88db00"/>
    </linearGradient>
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e45"/>
      <stop offset="100%" stop-color="#141724"/>
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="116" height="116" rx="26" fill="none" stroke="url(#cyberNeon)" stroke-width="2.5" opacity="0.8" filter="url(#neonGlow)"/>

  <!-- Cyber Hoodie / Shoulders -->
  <path d="M22 110 C24 95 36 84 48 80 L60 86 L72 80 C84 84 96 95 98 110 Z" fill="#151722"/>
  <path d="M48 80 L60 86 L72 80 L66 105 L54 105 Z" fill="none" stroke="url(#cyberNeon)" stroke-width="2" opacity="0.7"/>

  <!-- Headset Band -->
  <path d="M30 52 C30 26 90 26 90 52" fill="none" stroke="#2e344d" stroke-width="7" stroke-linecap="round"/>
  <path d="M32 50 C32 28 88 28 88 50" fill="none" stroke="url(#cyberNeon)" stroke-width="2.5" stroke-linecap="round" opacity="0.9" filter="url(#neonGlow)"/>

  <!-- Face / Head Contour -->
  <path d="M38 42 C38 28 82 28 82 42 C82 62 76 78 60 82 C44 78 38 62 38 42 Z" fill="url(#maskGrad)"/>

  <!-- Cyber Hair / Cap Visor -->
  <path d="M36 38 C42 24 78 24 84 38 L78 32 C68 28 52 28 42 32 Z" fill="#0d0e17"/>

  <!-- Earphones / Headset Cups -->
  <rect x="23" y="44" width="12" height="24" rx="6" fill="#1b1e2c" stroke="url(#cyberNeon)" stroke-width="1.5"/>
  <rect x="85" y="44" width="12" height="24" rx="6" fill="#1b1e2c" stroke="url(#cyberNeon)" stroke-width="1.5"/>
  <circle cx="29" cy="56" r="3" fill="url(#cyberNeon)" filter="url(#neonGlow)"/>
  <circle cx="91" cy="56" r="3" fill="url(#cyberNeon)" filter="url(#neonGlow)"/>

  <!-- Microphone Boom -->
  <path d="M31 62 Q31 78 48 76" fill="none" stroke="#2e344d" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="76" r="2.5" fill="url(#cyberNeon)" filter="url(#neonGlow)"/>

  <!-- Cyber Visor / Glowing Glasses -->
  <polygon points="41,47 79,47 75,59 60,63 45,59" fill="#0b0d14" stroke="#2e344d" stroke-width="1.5"/>
  <!-- Visor Neon Glow Streak -->
  <path d="M43 51 Q60 55 77 51" stroke="url(#cyberNeon)" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)"/>
  <circle cx="50" cy="53" r="1.5" fill="#ffffff"/>
  <circle cx="70" cy="53" r="1.5" fill="#ffffff"/>

  <!-- Tech Accent Lines -->
  <line x1="52" y1="68" x2="68" y2="68" stroke="url(#cyberNeon)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <circle cx="60" cy="72" r="1.5" fill="url(#cyberNeon)"/>
</svg>
